server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html  html;
        image/webp webp;
        image/png  png;
    }
    default_type application/octet-stream;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # The page images change contents but not names when the book is reprinted,
    # so no-cache: the browser keeps them but revalidates, and an unchanged page
    # comes back as a 304 with no body.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
